name: ci

# The check that runs BEFORE main. release.yml does lint and test, and those do
# gate the publish (they are steps ahead of it in the same job) — but it only
# triggers on a push to main, so nothing checks a pull request at all.
#
# Deliberately a second workflow rather than a trigger on release.yml: that one
# holds `id-token: write`, the npm trusted-publishing credential, and must not
# be reachable from a fork's pull request. This job is read-only and never
# touches the registry.
#
# Scope, so it is not mistaken for more than it is: PRs only. A direct push to
# main still reaches release.yml without `Build web` or either typecheck, and
# `vite build` strips types rather than checking them.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Matches release.yml: oxlint strips types off oxlint.config.ts natively
      # and needs >=22.18.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      # Must precede the web typecheck: src/routeTree.gen.ts is gitignored and
      # written by the tanstackStart vite plugin, so on a clean checkout tsc has
      # no route tree to resolve and every route file fails. Gates the build
      # itself too, which nothing else did. Needs no DATABASE_URL — db/index.ts
      # only throws when it is actually imported at runtime.
      - name: Build web
        working-directory: apps/web
        run: bun run build

      # apps/cli is gated on publish by its own prepublishOnly, but apps/web was
      # typechecked by nothing: its errors only ever surfaced in an editor.
      - name: Typecheck web
        working-directory: apps/web
        run: bunx tsc --noEmit

      - name: Typecheck cli
        working-directory: apps/cli
        run: bunx tsc --noEmit
