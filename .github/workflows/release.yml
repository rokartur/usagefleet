name: release

# On every push to main: build the collector as standalone binaries for every
# desktop OS and publish a GitHub Release with them attached.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Compute version
        id: meta
        run: |
          VERSION=$(node -p "require('./apps/collector/package.json').version")
          echo "tag=v${VERSION}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Baked into the binary so it can tell whether it is the latest release.
      # Local builds keep the committed "dev" value, which disables self-update.
      - name: Bake release tag
        run: |
          printf '// Generated by .github/workflows/release.yml.\nexport const RELEASE_TAG = "%s";\n' \
            "${{ steps.meta.outputs.tag }}" > apps/collector/src/release.ts

      - name: Build standalone binaries
        working-directory: apps/collector
        run: |
          set -euo pipefail
          mkdir -p dist
          ENTRY=src/index.ts
          build() { # <bun-target> <outfile>
            echo "→ $2"
            bun build "$ENTRY" --compile --target="$1" --outfile "dist/$2"
          }
          build bun-darwin-arm64  usagefleet-macos-arm64
          build bun-darwin-x64    usagefleet-macos-x64
          build bun-linux-x64     usagefleet-linux-x64
          build bun-linux-arm64   usagefleet-linux-arm64
          build bun-windows-x64   usagefleet-windows-x64.exe
          # Portable Node bundle (run with: node usagefleet.js <cmd>)
          bun build "$ENTRY" --target=node --outfile dist/usagefleet.js
          chmod +x dist/usagefleet-macos-* dist/usagefleet-linux-* || true

      - name: Checksums
        working-directory: apps/collector/dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: usagefleet ${{ steps.meta.outputs.tag }}
          body: |
            Standalone `usagefleet` collector binaries (built from `${{ github.sha }}`).

            Easiest install (downloads, verifies, enables autostart):

            ```bash
            # macOS / Linux
            curl -sSL https://usagefleet.com/install.sh | sh -s -- --token uf_xxx
            ```

            ```powershell
            # Windows
            $s = irm https://usagefleet.com/install.ps1
            & ([scriptblock]::Create($s)) -Token uf_xxx
            ```

            Or grab the binary for your OS manually (make it executable first on
            macOS/Linux):

            ```bash
            ./usagefleet init --endpoint https://your-server --token uf_xxx
            ./usagefleet install   # autostart: launchd / systemd / Task Scheduler
            ```

            | OS | Asset |
            |----|-------|
            | macOS (Apple Silicon) | `usagefleet-macos-arm64` |
            | macOS (Intel) | `usagefleet-macos-x64` |
            | Linux (x64) | `usagefleet-linux-x64` |
            | Linux (arm64) | `usagefleet-linux-arm64` |
            | Windows (x64) | `usagefleet-windows-x64.exe` |
            | Any (needs Node) | `usagefleet.js` |
          make_latest: true
          generate_release_notes: true
          files: |
            apps/collector/dist/usagefleet-macos-arm64
            apps/collector/dist/usagefleet-macos-x64
            apps/collector/dist/usagefleet-linux-x64
            apps/collector/dist/usagefleet-linux-arm64
            apps/collector/dist/usagefleet-windows-x64.exe
            apps/collector/dist/usagefleet.js
            apps/collector/dist/SHA256SUMS.txt
