services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Uncomment to reach the DB from the host (host port → container 5432):
    # ports:
    #   - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-app} -d $${POSTGRES_DB:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      # Context is the monorepo root so the workspace install sees bun.lock.
      context: .
      dockerfile: apps/web/Dockerfile
      # Explicit so a dev-target image built from docker-compose.dev.yml can
      # never be reused here (the dev stage has no source baked in).
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-app}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (>=32 chars)}
      # No default: better-auth takes the session cookie's Secure flag
      # from this scheme, so a silent http:// fallback would ship
      # non-Secure cookies on an HTTPS deploy that still looks healthy.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set to the public origin, e.g. https://usage.example.com}
      # Set to "false" to block new account creation.
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      # Comma-separated emails allowed into the /admin panel.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # GitHub and Google OAuth apps. Callback URLs must be
      # <BETTER_AUTH_URL>/api/auth/callback/{github,google}.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?set GITHUB_CLIENT_ID in .env}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?set GITHUB_CLIENT_SECRET in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in .env}
      # Resend, for the confirmation link a password sign-up must follow before
      # it gets a session. Required: without it those accounts can be created
      # but never entered. MAIL_FROM must use a domain verified in Resend.
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY in .env}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env}
      # Set to the number of trusted reverse proxies in front of the app (or
      # "true" for one) so rate limiting reads a real client IP from
      # X-Forwarded-For. Leave "false" for direct exposure — see .env.example.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Those same proxies as addresses/CIDRs, which is what better-auth matches
      # on for its own sign-in limits. Set this on ANY proxied deployment: left
      # empty, one forged X-Forwarded-For makes better-auth throttle every
      # sign-in against a single shared bucket. See .env.example.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Stripe billing — the device cap comes from the subscription, so all five
      # are required. Point the Stripe webhook at <app>/api/auth/stripe/webhook.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY in .env}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?set STRIPE_WEBHOOK_SECRET in .env}
      STRIPE_PRICE_SOLO: ${STRIPE_PRICE_SOLO:?set STRIPE_PRICE_SOLO in .env}
      STRIPE_PRICE_FLEET: ${STRIPE_PRICE_FLEET:?set STRIPE_PRICE_FLEET in .env}
      # Per-unit price, multiplied by the chosen device count.
      STRIPE_PRICE_CUSTOM: ${STRIPE_PRICE_CUSTOM:?set STRIPE_PRICE_CUSTOM in .env}
      NODE_ENV: production
    ports:
      # Loopback only: TRUST_PROXY tells the app to believe X-Forwarded-For, and
      # nothing can distinguish a proxied request from a direct one that forged
      # the header, so the port must not be reachable except through the proxy.
      # A proxy on another host needs this changed AND the port firewalled.
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      # The standalone runner image has no curl/wget — use Bun's built-in fetch.
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  pgdata:
